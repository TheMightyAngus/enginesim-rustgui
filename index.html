<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>ENGINE·SIM</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c0d10;
        touch-action: manipulation;
      }
      canvas {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #loading_text {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #c8ccd4;
        font: 500 13px/1.4 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .spin {
        width: 22px;
        height: 22px;
        margin: 14px auto 0;
        border-radius: 50%;
        border: 2px solid #3a3d46;
        border-top-color: #e86a2a;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <canvas id="the_canvas_id"></canvas>
    <div id="loading_text">
      <div>
        ENGINE·SIM
        <div class="spin"></div>
      </div>
    </div>
  </body>
</html>
