[package]
name = "engine_sim"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "ENGINE·SIM — modular cartoon cutaway engine simulator (egui/eframe WASM)"
license = "MIT"

[dependencies]
egui = "0.31"
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
] }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
